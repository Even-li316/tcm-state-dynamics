name: smoke

on:
  push:
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt jsonschema
      - name: engine smoke test
        run: python tests/smoke.py
      - name: external-therapy operator contract
        run: python engine/external_therapy.py contrib/external/EXAMPLE_electroacupuncture_st36.json
      - name: validate contributed records (schema + privacy lint)
        run: python tools/validate_contribution.py
